// installed to /usr/lib/firefox/mozilla.cfg (the first line must be a comment)
// adds ctrl+1..8 to jump to a tab and ctrl+9 for the last tab (alt+n still works),
// and points new tabs at newtab/index.html

function gbAddTabKeys(win) {
  try {
    const doc = win.document;
    if (!win.gBrowser || doc.getElementById("gb-tabkeys")) return;
    const commands = doc.createXULElement("commandset");
    const keys = doc.createXULElement("keyset");
    commands.id = "gb-tabcommands";
    keys.id = "gb-tabkeys";
    for (let i = 1; i <= 9; i++) {
      const cmd = doc.createXULElement("command");
      cmd.id = "gb-cmd-tab" + i;
      cmd.addEventListener("command", () => win.gBrowser.selectTabAtIndex(i === 9 ? -1 : i - 1));
      commands.appendChild(cmd);
      const key = doc.createXULElement("key");
      key.id = "gb-key-tab" + i;
      key.setAttribute("modifiers", "accel");
      key.setAttribute("key", String(i));
      key.setAttribute("command", cmd.id);
      keys.appendChild(key);
    }
    const main = doc.getElementById("mainKeyset");
    main.parentNode.insertBefore(commands, main);
    main.parentNode.insertBefore(keys, main);
  } catch (e) {
    Cu.reportError(e);
  }
}

// new tabs and the home page open the local quotes page instead of about:newtab
// (~/.config/xmonad/firefox/newtab/index.html; the address bar still stays empty)
const gbNewTab = (() => {
  const f = Services.dirsvc.get("Home", Ci.nsIFile);
  for (const part of [".config", "xmonad", "firefox", "newtab", "index.html"]) f.append(part);
  return Services.io.newFileURI(f).spec;
})();

function gbSetNewTab() {
  try {
    const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
    if (AboutNewTab.newTabURL !== gbNewTab) AboutNewTab.newTabURL = gbNewTab;
  } catch (e) {
    Cu.reportError(e);
  }
}

try {
  defaultPref("browser.startup.homepage", gbNewTab);
  gbSetNewTab();
} catch (e) {
  Cu.reportError(e);
}

try {
  Services.obs.addObserver(win => {
    gbSetNewTab();  // again once the browser is up, in case startup reset it
    gbAddTabKeys(win);
  }, "browser-delayed-startup-finished");
} catch (e) {
  Cu.reportError(e);
}
