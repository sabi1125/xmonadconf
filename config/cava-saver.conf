# ~/.config/xmonad/config/cava-saver.conf
# raw visualizer feed for the screensaver's music view (scripts/screensaver/saver.py)
# bars / ascii_max_range must match BARS / LEVELS in saver.py

[general]
framerate = 30
bars = 32
autosens = 1
sleep_timer = 0

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 12
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
monstercat = 1
noise_reduction = 70
