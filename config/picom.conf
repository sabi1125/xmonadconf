# ~/.config/xmonad/config/picom.conf   (picom v13)

backend = "glx";
vsync = true;
use-ewmh-active-win = true;
detect-rounded-corners = true;
detect-client-opacity = true;

# shadows
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -16;
shadow-offset-y = -12;
shadow-color = "#000000";

# fades
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 4;

# corners
corner-radius = 8;

# blur (only applied where a rule enables it)
blur-method = "dual_kawase";
blur-strength = 4;

rules = (
  { match = "window_type = 'normal' || window_type = 'dialog'"; blur-background = false; },
  { match = "class_g = 'Alacritty'"; blur-background = true; },
  { match = "class_g = 'firefox'"; blur-background = true; },
  { match = "!focused && window_type = 'normal'"; dim = 0.06; },

  { match = "window_type = 'desktop'"; shadow = false; corner-radius = 0; dim = 0; },
  # bar islands: rounded, soft shadow, frosted
  { match = "class_i = 'xmobar' || window_type = 'dock'"; shadow = true; corner-radius = 8; dim = 0; blur-background = true; },
  # concave flares where the islands meet the top edge (scripts/bar/fillets.py): the shape is in the pixels
  { match = "class_g = 'BarFillet'"; shadow = false; corner-radius = 0; dim = 0; blur-background = false; fade = false; },
  # status pills on the right (xmobar wmName): half the 24px height, so text pills are capsules and icon pills circles
  { match = "name = 'xmobar-pill'"; corner-radius = 12; },
  { match = "window_type = 'tooltip' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu'";
    shadow = false; corner-radius = 4; },
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; },
  { match = "class_g = 'slop' || class_g = 'maim'";
    shadow = false; blur-background = false; corner-radius = 0; fade = false; },
  { match = "fullscreen"; corner-radius = 0; dim = 0; },
  # now-playing card under the center island
  { match = "class_g = 'MediaCard'"; shadow = true; corner-radius = 10; dim = 0; blur-background = true; },
  # workspace peek card under the left island (scripts/bar/ws-peek.py)
  { match = "class_g = 'WsPeek'"; shadow = true; corner-radius = 10; dim = 0; blur-background = true; },

  # fcitx5 candidate popup (gruvbox theme in ~/.local/share/fcitx5/themes/gruvbox): no fade, it redraws per keystroke
  { match = "class_g = 'fcitx'"; shadow = true; corner-radius = 8; dim = 0; blur-background = false; fade = false; },

  # gentle pop-in / pop-out
  { match = "window_type = 'normal' || window_type = 'dialog'";
    animations = (
      { triggers = [ "open", "show" ]; preset = "appear"; duration = 0.18; scale = 0.94; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.14; scale = 0.94; }
    );
  },

  # mellow shell (shell/mellow.py): every piece paints its own shape (and is cut
  # to it), so picom must not round, shadow or dim it; it does blur what shows
  # through. panels slide out of the frame.
  { match = "class_g = 'MellowFrame' || class_g = 'MellowTop' || class_g = 'MellowRight' || class_g = 'MellowLeft'";
    shadow = false; corner-radius = 0; dim = 0; blur-background = true; },
  { match = "class_g = 'MellowFrame'"; fade = false; },
  { match = "class_g = 'MellowTop'";
    animations = (
      { triggers = [ "open", "show" ]; preset = "slide-in"; direction = "up"; duration = 0.22; },
      { triggers = [ "close", "hide" ]; preset = "slide-out"; direction = "up"; duration = 0.16; }
    );
  },
  { match = "class_g = 'MellowLeft'";
    animations = (
      { triggers = [ "open", "show" ]; preset = "slide-in"; direction = "left"; duration = 0.2; },
      { triggers = [ "close", "hide" ]; preset = "slide-out"; direction = "left"; duration = 0.14; }
    );
  },
  { match = "class_g = 'MellowRight'";
    animations = (
      { triggers = [ "open", "show" ]; preset = "slide-in"; direction = "right"; duration = 0.22; },
      { triggers = [ "close", "hide" ]; preset = "slide-out"; direction = "right"; duration = 0.16; }
    );
  }
);
