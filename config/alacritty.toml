# ~/.config/xmonad/config/alacritty.toml
# imported from ~/.config/alacritty/alacritty.toml

[window]
padding = { x = 14, y = 14 }
dynamic_padding = true
decorations = "None"
opacity = 0.94

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 11.0

[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = true

[selection]
save_to_clipboard = true

[colors.primary]
background = "#181616"
foreground = "#c5c9c5"

[colors.cursor]
text = "#12120f"
cursor = "#c4b28a"

[colors.selection]
text = "CellForeground"
background = "#2d4f67"

# kanagawa dragon
[colors.normal]
black   = "#181616"
red     = "#c4746e"
green   = "#8a9a7b"
yellow  = "#c4b28a"
blue    = "#8ba4b0"
magenta = "#a292a3"
cyan    = "#8ea4a2"
white   = "#c8c093"

[colors.bright]
black   = "#737c73"
red     = "#e46876"
green   = "#87a987"
yellow  = "#e6c384"
blue    = "#7fb4ca"
magenta = "#938aa9"
cyan    = "#7aa89f"
white   = "#c5c9c5"
