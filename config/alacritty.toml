# ~/.config/xmonad/config/alacritty.toml
# imported from ~/.config/alacritty/alacritty.toml

[window]
padding = { x = 14, y = 14 }
dynamic_padding = true
decorations = "None"
opacity = 0.94

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 11.0

[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = true

[selection]
save_to_clipboard = true

[colors.primary]
background = "#141416"
foreground = "#f2f2f7"

[colors.cursor]
text = "#141416"
cursor = "#d6cfbf"

[colors.selection]
text = "CellForeground"
background = "#2c2c2e"

# macOS Tahoe dark system colours
[colors.normal]
black   = "#1c1c1e"
red     = "#ff453a"
green   = "#30d158"
yellow  = "#ffd60a"
blue    = "#0a84ff"
magenta = "#bf5af2"
cyan    = "#5ac8fa"
white   = "#c7c7cc"

[colors.bright]
black   = "#636366"
red     = "#ff6961"
green   = "#4cd964"
yellow  = "#ffe55c"
blue    = "#409cff"
magenta = "#da8fff"
cyan    = "#70d7ff"
white   = "#f2f2f7"
