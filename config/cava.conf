# ~/.config/xmonad/config/cava.conf
# raw visualizer feed for the center island (scripts/bar/cava.sh)

[general]
framerate = 24
bars = 8
autosens = 1
sleep_timer = 0

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
